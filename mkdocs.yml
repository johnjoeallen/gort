site_name: Gort
site_description: "A small compiled language for network servers: C++-style value types, Go-style embedding, reference counting built into the language, and no garbage collector. Designed one measured step at a time"
site_url: https://johnjoeallen.github.io/gort/
repo_url: https://github.com/johnjoeallen/gort
repo_name: johnjoeallen/gort
theme:
  name: material
  logo: assets/logo-mark-dark.svg
  favicon: assets/logo-mark-light.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
extra:
  version:
    provider: mike
    default: latest
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc: { permalink: true }
nav:
  - Home: index.md
  - The journey:
      - journey/index.md
      - 1. Why Gort: journey/01-why.md
      - 2. Measuring the foundations: journey/02-foundations.md
      - 3. An HTTP server: journey/03-http.md
      - 4. Measured Against Go, Java and Rust: journey/04-comparison.md
      - 5. mini-redis: journey/05-mini-redis.md
      - 6. Locks that park: journey/06-locks.md
  - Sharing and access checking: sharing.md
  - Architecture:
      - architecture/index.md
      - Suspension and continuations: architecture/suspension.md
      - Compiled modules and linking: architecture/modules.md
      - Dispatch and external code: architecture/dispatch-and-ffi.md
      - Evaluation plan: architecture/benchmarks.md
      - Open decisions: architecture/open-decisions.md
      - Changes and contradictions: architecture/changes.md
  - Decisions: decisions.md
  - Open questions: open-questions.md
  - Repository map: repo-map.md
