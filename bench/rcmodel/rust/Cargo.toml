[package]
name = "rcm"
version = "0.1.0"
edition = "2021"

[lib]
name = "rcmlib"
path = "src/lib.rs"

[[bin]]
name = "rcm"
path = "src/main.rs"

[[bench]]
name = "micro"
harness = false

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
